<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تجربة تعبئة المحضر</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#e9eceb;
  font-family:Arial,Tahoma,sans-serif;
}

.toolbar{
  width:100%;
  margin:0 0 12px;
  padding:8px 10px;
  background:#fff;
  border:1px solid #e2e8e5;
  border-radius:12px;
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.toolbar button{
  min-width:38px;
  height:34px;
  border:1px solid #d7e0dc;
  background:#fff;
  color:#23302b;
  border-radius:8px;
  padding:0 10px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}
.toolbar button:hover{
  background:#f4f8f6;
  border-color:#bfcfc8;
}
.toolbar button:active{
  transform:translateY(1px);
}

.toolbar span{
  margin-right:auto;
  color:#666;
  font-size:11px;
}

.page{
  position:relative;
  width:720px;
  margin:0 0 20px;
}

.page img{
  position:relative;
  display:block;
  width:720px;
  height:auto;
  pointer-events:none;
  user-select:none;
}

.write{
  position:absolute;
  border:0 !important;
  outline:0 !important;
  resize:none;
  background:transparent !important;
  color:#000 !important;
  font-family:Arial,Tahoma,sans-serif;
  font-size:16px;
  font-weight:400;
  line-height:1.55;
  padding:2px 3px;
  margin:0;
  overflow:hidden;
  direction:rtl;
  text-align:right;
  z-index:10;
  caret-color:#000;
  white-space:pre-wrap;
  overflow-wrap:break-word;
}


.report-number{
  direction:ltr !important;
  text-align:center !important;
  font-size:15px !important;
  line-height:1.3 !important;
  font-weight:400 !important;
  padding:1px 2px !important;
}


.table-field{
  box-sizing:border-box !important;
  resize:none !important;
  overflow:hidden !important;
  white-space:pre-wrap !important;
  overflow-wrap:anywhere !important;
  word-break:normal !important;

  direction:rtl !important;
  text-align:center !important;

  padding:2px 5px !important;
  margin:0 !important;

  line-height:1.35 !important;
  vertical-align:middle !important;

  border:0 !important;
  outline:0 !important;
  background:transparent !important;
}

.table-field:focus{
  border:0 !important;
  outline:0 !important;
  background:transparent !important;
  box-shadow:none !important;
}


.top-cell{
  box-sizing:border-box;
  font-family:Arial,Tahoma,sans-serif;
  font-size:14px;
  line-height:1.25;
  direction:rtl;
  text-align:right;
  padding:2px 4px;
  margin:0;
  border:0;
  outline:0;
  background:transparent;
  resize:none;
  overflow:hidden;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;
}

.top-cell:focus{
  border:0 !important;
  outline:0 !important;
  background:transparent !important;
  box-shadow:none !important;
}

.basis-field{
  overflow:hidden !important;
  white-space:pre-wrap;
  overflow-wrap:break-word;
  word-break:normal;
  padding:2px 3px !important;
  line-height:1.5 !important;
}
.write:focus{
  border:0 !important;
  outline:0 !important;
  background:transparent !important;
  box-shadow:none !important;
}

.sig{
  position:absolute;
  z-index:20;
  border:0;
  background:transparent;
  touch-action:none;
  cursor:crosshair;
}

@media print{
  body{
    background:#fff;
    padding:0;
  }
  .toolbar{
    display:none;
  }
  .page{
    width:720px;
    margin:0;
    page-break-after:always;
  }
}
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="setSize(14)">14</button>
  <button onclick="setSize(16)">16</button>
  <button onclick="setSize(18)">18</button>
  <button onclick="setSize(20)">20</button>
  <button onclick="toggleBold()">عريض</button>
  <button onclick="alignText('right')">يمين</button>
  <button onclick="alignText('center')">وسط</button>
  <button onclick="clearSignature()">مسح التوقيع</button>
  
  <span>حدد الخانة ثم اكتب مباشرة</span>
</div>

<!-- ========================= الصفحة الأولى ========================= -->
<div class="page">
  <img src="page1.jpg" alt="المحضر - الصفحة الأولى">

  <!-- رقم المحضر: تحت عنوان المحضر مباشرة -->
  <input class="write report-number"
         data-key="reportNo"
         inputmode="numeric"
         maxlength="20"
         placeholder="رقم المحضر"
         style="left:544px;top:96px;width:74px;height:25px">

  <!-- بيانات المخالفة -->
  <textarea class="write table-field" data-key="entity"
            style="left:285px;top:258px;width:178px;height:37px"></textarea>

  <textarea class="write table-field" data-key="unifiedNo"
            style="left:55px;top:258px;width:116px;height:37px"></textarea>

  <textarea class="write table-field" data-key="type"
            style="left:285px;top:301px;width:178px;height:52px"></textarea>

  <textarea class="write table-field" data-key="location"
            style="left:55px;top:301px;width:116px;height:52px"></textarea>

  <textarea class="write table-field" data-key="reportDate"
            style="left:285px;top:362px;width:178px;height:25px"></textarea>

  <textarea class="write table-field" data-key="incidentDate"
            style="left:55px;top:362px;width:116px;height:25px"></textarea>

  <!-- أولاً: يكتب تحت العبارة، وليس فوقها -->
  <textarea class="write basis-field" data-key="basis"
            style="left:55px;top:455px;width:610px;height:210px"></textarea>

  <!-- ثانياً / أ. وقائع المخالفة -->
  <textarea class="write" data-key="facts"
            style="left:55px;top:720px;width:610px;height:195px"></textarea>
</div>

<!-- ========================= الصفحة الثانية ========================= -->
<div class="page">
  <img src="page2.jpg" alt="المحضر - الصفحة الثانية">

  <!-- ب. الوصف التفصيلي -->
  <textarea class="write" data-key="details"
            style="left:55px;top:232px;width:610px;height:150px"></textarea>

  <!-- ج. الأضرار -->
  <textarea class="write" data-key="damages"
            style="left:55px;top:410px;width:610px;height:68px"></textarea>

  <!-- ثالثاً: المستندات -->
  <textarea class="write" data-key="documents"
            style="left:55px;top:505px;width:610px;height:82px"></textarea>

  <!-- رابعاً: الطلبات -->
  <textarea class="write" data-key="requests"
            style="left:55px;top:650px;width:610px;height:58px"></textarea>

  <!-- خامساً: أقوال/دفوع -->
  <textarea class="write" data-key="defense"
            style="left:55px;top:710px;width:610px;height:108px"></textarea>

  <!-- اسم المفتش -->
  <input class="write" data-key="inspector"
         style="left:405px;top:832px;width:165px;height:38px">

  <!-- التوقيع -->
  <canvas id="signature"
          class="sig"
          width="190"
          height="60"
          style="left:232px;top:828px;width:112px;height:43px"></canvas>
</div>

<script>


function fitLongText(el){
  if(!el || el.tagName!=='TEXTAREA') return;

  const original=parseFloat(el.dataset.baseFont || getComputedStyle(el).fontSize || 14);
  let size=original;

  el.style.fontSize=size+'px';

  // حجم أولي مريح
  while(size>11 && el.scrollHeight>el.clientHeight+2){
    size-=0.5;
    el.style.fontSize=size+'px';
  }

  // تثبيت مكان الكتابة في الأعلى
  el.scrollTop=0;
}

const MIN_FONT_SIZE=14;
const MAX_FONT_SIZE=16;

function fitText(el){
  if(!el || !el.classList.contains('write')) return;

  let size=parseFloat(getComputedStyle(el).fontSize) || 14;

  // ابدأ من الحجم الحالي
  el.style.fontSize=size+'px';

  // نترك المتصفح يلف السطور، ثم نقلل الحجم عند الحاجة
  while(
    size > MIN_FONT_SIZE &&
    (el.scrollHeight > el.clientHeight + 2 ||
     el.scrollWidth > el.clientWidth + 2)
  ){
    size -= 0.5;
    el.style.fontSize=size+'px';
  }
}

function fitAllText(){
  document.querySelectorAll('textarea.write').forEach(fitText);
}



function fitBasisField(el){
  if(!el || !el.classList.contains('basis-field')) return;

  /*
   * خانة أولاً تستوعب النص كاملًا.
   * لا نصغّر الخط ولا نضع حدًا أقصى لارتفاع الخانة.
   */
  const facts = document.querySelector('[data-key="facts"]');

  const baseTop = 455;
  const baseHeight = 210;
  const gap = 18;
  const factsBaseTop = 720;

  if(!el.dataset.baseFont){
    el.dataset.baseFont =
      getComputedStyle(el).fontSize || '15px';
  }

  const fontSize =
    parseFloat(el.dataset.userFontSize || el.dataset.baseFont) || 15;

  el.style.fontSize = fontSize + 'px';

  /*
   * reset ثم قياس الارتفاع الحقيقي المطلوب للنص
   */
  el.style.height = baseHeight + 'px';
  el.style.overflow = 'hidden';

  const requiredHeight = Math.max(
    baseHeight,
    el.scrollHeight + 8
  );

  el.style.height = requiredHeight + 'px';

  /*
   * تحريك خانة ثانياً بناءً على الارتفاع الحقيقي لخانة أولاً.
   */
  if(facts){
    const newFactsTop = Math.max(
      factsBaseTop,
      baseTop + requiredHeight + gap
    );

    facts.style.top = newFactsTop + 'px';

    /*
     * نخلي facts تستوعب ما تستطيع من المساحة المتبقية،
     * بدل قصّها فجأة.
     */
    const page = el.closest('.page');

    if(page){
      const pageHeight = page.offsetHeight || 1008;
      const bottomMargin = 25;

      const availableHeight =
        pageHeight - newFactsTop - bottomMargin;

      if(availableHeight > 40){
        facts.style.height =
          Math.max(40, availableHeight) + 'px';
      }
    }
  }

  el.scrollTop = 0;
}


function fitText(el){
  if(!el || !el.classList.contains('write')) return;

  /*
   * لا نغيّر حجم الخط تلقائيًا للخانات العادية.
   * الخط الذي اختاره المستخدم يبقى كما هو.
   */
  const size=parseFloat(
    el.dataset.userFontSize ||
    getComputedStyle(el).fontSize ||
    15
  );

  el.style.fontSize=size+'px';
}

function fitAllText(){
  document.querySelectorAll('textarea.write').forEach(fitText);

  const basis=document.querySelector('[data-key="basis"]');
  if(basis) fitBasisField(basis);
}


let active=null;

/*
 * =========================
 * الخانات العلوية
 * =========================
 * نخلي النص يستفيد من كامل مساحة الخانة،
 * مع التفاف طبيعي داخلها، ومن دون تغيير
 * حجم الخط أثناء الكتابة.
 */
const TOP_CELL_KEYS = [
  'entity',
  'unifiedNo',
  'type',
  'location',
  'reportDate',
  'incidentDate'
];

/*
 * ==========================================================
 * إصلاح الخانات العلوية فقط
 *
 * الهدف:
 * - الخانة تبقى في مكانها وبنفس أبعادها الأصلية.
 * - النص يلتف داخل الخانة.
 * - إذا كان النص طويلًا، يصغر الخط تدريجيًا.
 * - لا يختفي آخر النص.
 * - لا نغيّر أي شيء في بقية المحضر.
 * ==========================================================
 */
function fitTopCell(el){
  if(!el || !TOP_CELL_KEYS.includes(el.dataset.key)) return;

  const maxSize = parseFloat(
    el.dataset.userFontSize || '14'
  );

  const minSize = 8;

  el.style.boxSizing = 'border-box';
  el.style.width = el.style.width;
  el.style.height = el.style.height;

  el.style.padding = '2px 4px';
  el.style.margin = '0';

  el.style.direction = 'rtl';
  el.style.textAlign = 'center';

  el.style.lineHeight = '1.2';

  el.style.whiteSpace = 'pre-wrap';
  el.style.overflowWrap = 'anywhere';
  el.style.wordBreak = 'break-word';

  el.style.resize = 'none';
  el.style.overflow = 'hidden';

  let size = maxSize;

  el.style.fontSize = size + 'px';

  /*
   * نبحث عن أكبر حجم خط يسمح بعرض النص كاملًا
   * داخل نفس الخانة.
   */
  while(
    size > minSize &&
    (
      el.scrollHeight > el.clientHeight + 1 ||
      el.scrollWidth > el.clientWidth + 1
    )
  ){
    size -= 0.25;
    el.style.fontSize = size + 'px';
  }

  el.scrollTop = 0;
}

function fitAllTopCells(){
  TOP_CELL_KEYS.forEach(key=>{
    const el = document.querySelector(
      '[data-key="' + key + '"]'
    );

    if(el) fitTopCell(el);
  });
}


  TOP_CELL_KEYS.forEach(key=>{
    const el=document.querySelector('[data-key="'+key+'"]');
    if(el) fitTopCell(el);
  });
}

document.querySelectorAll('.write').forEach(el=>{
  el.addEventListener('focus',()=>{
    active=el;

    if(TOP_CELL_KEYS.includes(el.dataset.key)){
      fitTopCell(el);
    }

    if(el.classList.contains('basis-field')){
      fitBasisField(el);
    }
  });

  el.addEventListener('click',()=>{
    active=el;

    if(TOP_CELL_KEYS.includes(el.dataset.key)){
      fitTopCell(el);
    }

    if(el.classList.contains('basis-field')){
      fitBasisField(el);
    }
  });

  if(el.classList.contains('basis-field')){
    el.addEventListener('input',()=>fitBasisField(el));
    el.addEventListener('paste',()=>setTimeout(()=>fitBasisField(el),30));
  }

  el.addEventListener('input',()=>{
    if(TOP_CELL_KEYS.includes(el.dataset.key)){
      fitTopCell(el);
    }

    if(el.classList.contains('basis-field')){
      fitBasisField(el);
    }
  });
});

window.addEventListener('load',()=>{
  fitAllText();
  fitAllTopCells();
});

function setSize(size){
  if(!active)return;

  active.dataset.userFontSize=String(size);
  active.style.fontSize=size+'px';

  if(active.classList.contains('basis-field')){
    fitBasisField(active);
  }

  active.focus();
}

function toggleBold(){
  if(!active)return;
  active.style.fontWeight =
    active.style.fontWeight==='700' ? '400' : '700';
  active.focus();
}

function alignText(v){
  if(!active)return;
  active.style.textAlign=v;
  active.focus();
}

/* ========================= التوقيع ========================= */

const canvas=document.getElementById('signature');
const ctx=canvas.getContext('2d');
let drawing=false;

function point(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*(canvas.width/r.width),
    y:(e.clientY-r.top)*(canvas.height/r.height)
  };
}

canvas.addEventListener('pointerdown',e=>{
  drawing=true;
  canvas.setPointerCapture(e.pointerId);
  const p=point(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
});

canvas.addEventListener('pointermove',e=>{
  if(!drawing)return;
  const p=point(e);
  ctx.lineTo(p.x,p.y);
  ctx.strokeStyle='#0b4ea2';
  ctx.lineWidth=1.4;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.stroke();
});

canvas.addEventListener('pointerup',()=>drawing=false);
canvas.addEventListener('pointercancel',()=>drawing=false);

function clearSignature(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
</script>

</body>
</html>
